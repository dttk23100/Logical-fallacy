<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121314">
  <title>Fallacy Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="live">
  <svg width="0" height="0" class="defs" aria-hidden="true">
    <symbol id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"/>
    </symbol>
  </svg>

  <header class="top">
    <h1>Fallacy Detector</h1>
    <div class="top-right">
      <button id="dictionary-open" class="plain" type="button">Dictionary</button>
      <label class="lang"><span class="sr">Spoken language</span>
        <select id="language"></select>
      </label>
    </div>
  </header>

  <!-- Live view: the conversation as it happens -->
  <main id="live" class="page">
    <p id="error" class="error" role="alert" hidden></p>

    <div id="empty" class="empty">
      <p>Tap the microphone and talk. Fallacies appear under the line where they happen.</p>
      <button id="example" class="plain" type="button">Try a sample conversation</button>
    </div>

    <ol id="transcript" class="turns" aria-label="Conversation"></ol>
  </main>

  <!-- Summary view: after the conversation ends -->
  <main id="summary" class="page" hidden>
    <div id="summary-body"></div>
    <div class="summary-actions">
      <button id="back" class="plain" type="button">Back to conversation</button>
      <button id="fresh" class="plain" type="button">New conversation</button>
    </div>
  </main>

  <!-- Dictionary view: every fallacy the detector names, with a one-line meaning -->
  <main id="dictionary" class="page" hidden>
    <button id="dictionary-close" class="plain" type="button">Back</button>
    <h2 class="sum-title">Dictionary</h2>
    <label class="sr" for="dictionary-search">Search the dictionary</label>
    <input id="dictionary-search" class="search" type="search" autocomplete="off" placeholder="Search">
    <div id="dictionary-list"></div>
  </main>

  <footer id="dock" class="dock">
    <form id="type-form" class="type-form" hidden>
      <label class="sr" for="type-input">Type what was said</label>
      <input id="type-input" type="text" autocomplete="off" placeholder="Type what was said, then Enter">
    </form>
    <div class="dock-row">
      <button id="type-toggle" class="plain side" type="button">Type</button>
      <button id="mic" class="mic" type="button" aria-label="Start listening">
        <svg aria-hidden="true"><use href="#icon-mic"/></svg>
      </button>
      <button id="end" class="plain side" type="button" disabled>End</button>
    </div>
    <p id="status" class="status" role="status">Tap to listen</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
